name: Extract font archives
on:
  push:
    paths:
      - '.github/workflows/extract-fonts.yml'
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and inspect fonts
        run: |
          python -m pip install --quiet fonttools
          mkdir -p assets/fonts
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from fontTools.ttLib import TTFont
          import shutil, re
          for archive in sorted(Path('.').glob('*.zip')):
              print(f"\\nARCHIVE: {archive.name}")
              with ZipFile(archive) as z:
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      suffix = Path(info.filename).suffix.lower()
                      if suffix not in {'.ttf', '.otf', '.woff', '.woff2'}:
                          if Path(info.filename).name.lower() in {'readme.txt','license.txt','ofl.txt'}:
                              print("SUPPORT FILE:", info.filename)
                          continue
                      raw = z.read(info.filename)
                      stem = re.sub(r'[^a-zA-Z0-9_-]+','-',Path(info.filename).stem).strip('-').lower() or 'font'
                      dest = Path('assets/fonts') / f"{archive.stem}-{stem}{suffix}"
                      dest.write_bytes(raw)
                      try:
                          font = TTFont(str(dest))
                          names = font['name'].names
                          def name(nid):
                              for n in names:
                                  if n.nameID == nid:
                                      try: return n.toUnicode()
                                      except: pass
                              return ''
                          print(f"FONT: {dest} | family={name(1)} | subfamily={name(2)} | full={name(4)}")
                      except Exception as e:
                          print(f"FONT: {dest} | metadata unavailable: {e}")
          PY
      - name: Commit extracted font files
        run: |
          if [ -n "$(git status --porcelain assets/fonts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/fonts
            git commit -m "Extract game font assets [skip ci]"
            git push
          else
            echo "No font files found to add."
          fi
