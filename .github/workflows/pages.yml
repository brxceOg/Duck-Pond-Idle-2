name: Deploy Duck Pond Idle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Rubber Duck font
        run: |
          unzip -o rubber_duck.zip -d assets/fonts
          test -s assets/fonts/Rubber-Duck.ttf
      - name: Download and install Just Ducky font
        run: |
          mkdir -p assets/fonts /tmp/justducky-font
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0" "https://dl.dafont.com/dl/?f=justducky" -o /tmp/justducky.zip
          unzip -o /tmp/justducky.zip -d /tmp/justducky-font
          FONT_FILE="$(find /tmp/justducky-font -type f -iname 'JustDucky.ttf' -print -quit)"
          test -n "$FONT_FILE"
          cp "$FONT_FILE" assets/fonts/JustDucky.ttf
          test -s assets/fonts/JustDucky.ttf
      - name: Verify uploaded game fonts
        run: |
          test -s assets/fonts/duck-duck.ttf
          test -s assets/fonts/ducky-ducky.ttf
          test -s assets/fonts/funny_duck-funnyduck.ttf
      - name: Generate independent pre-colored duck PNGs
        run: |
          python3 -m pip install --quiet Pillow numpy
          python3 tools/generate_duck_pngs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ducks/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate independent pre-colored duck PNG sprites"
            git push
          fi
      - name: Validate game JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No game script found"
          Path("/tmp/duck-pond.js").write_text("\\n".join(scripts))
          PY
          node --check /tmp/duck-pond.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
