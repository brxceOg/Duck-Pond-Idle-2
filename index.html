/* Pastel capsule dispenser — custom game artwork guided by the repository reference. */
.machine{height:258px;width:100%;max-width:220px;margin:auto;position:relative;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;filter:drop-shadow(0 6px 0 #c8b49a)}
.machine-top{position:relative;z-index:2;width:45%;height:27px;flex:none;margin-bottom:-2px;border:4px solid #71334f;border-radius:50% 50% 18% 18%;background:linear-gradient(100deg,#ffc5e8 0%,#f49bd0 55%,#df78b6 100%);box-shadow:inset 3px 3px 0 #fff8f2}
.machine-top:before{content:"";position:absolute;width:34%;height:12px;left:33%;top:-14px;border:4px solid #71334f;border-bottom:0;border-radius:18px 18px 0 0;background:#f7addb}
.machine-top span{position:absolute;left:25%;top:5px;width:24%;height:5px;border-radius:50%;background:#fff8f4;transform:rotate(-18deg)}
.globe{position:relative;z-index:1;width:min(100%,178px);aspect-ratio:1/1;height:auto;flex:none;overflow:hidden;border:6px solid #71334f;border-radius:49% 49% 43% 43% / 48% 48% 44% 44%;background:radial-gradient(ellipse at 30% 20%,#ffffffc9 0 4%,#ffffff3d 13%,transparent 35%),linear-gradient(145deg,#d9f8f4e8 0%,#bce9e8d9 48%,#87c9c9ed 100%);box-shadow:inset 0 0 0 3px #fff9,inset -9px -8px 18px #4c9f9c38,0 3px 0 #b96c9e}
.capsules{position:absolute;inset:38% 10% 9%;display:flex;align-content:flex-end;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 3px;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.capsule{position:relative;display:block;flex:0 0 27px;width:27px;height:25px;border:2.5px solid #71334f;border-radius:50%;background:linear-gradient(180deg,#fff8fa 0 47%,#f7add6 48% 100%);box-shadow:inset -3px -3px 0 #71334f12,1px 2px 0 #ffffff55}
.capsule:before{content:"";position:absolute;left:4px;top:3px;width:7px;height:4px;border-radius:50%;background:#fff;transform:rotate(-28deg)}
.capsule:after{content:"";position:absolute;left:1px;right:1px;top:46%;height:2px;background:#71334f55}
.capsule:nth-child(3n+2){background:linear-gradient(180deg,#fffdf4 0 47%,#f8d76c 48% 100%)}
.capsule:nth-child(3n){background:linear-gradient(180deg,#fff 0 47%,#8fd7dc 48% 100%)}
.capsule:nth-child(4n){background:linear-gradient(180deg,#fff9fb 0 47%,#b9a5e7 48% 100%)}
.capsule:nth-child(5n){background:linear-gradient(180deg,#fff9f1 0 47%,#ff9a7f 48% 100%)}
.glass-glint{position:absolute;z-index:3;left:12%;top:17%;width:8px;height:39px;border-radius:99px;background:#fff9;transform:rotate(23deg);box-shadow:0 0 0 2px #ffffff20}
.machine-collar{z-index:2;width:94%;height:17px;flex:none;margin-top:-3px;border:4px solid #71334f;border-radius:50%;background:linear-gradient(90deg,#f6a9d7,#ffd0eb 48%,#e78bc4);box-shadow:inset 0 3px 0 #fff8}
.machine-base{position:relative;width:86%;height:91px;flex:none;margin-top:-4px;border:5px solid #71334f;border-radius:13px 13px 28px 28px;background:linear-gradient(100deg,#f6a0d2 0%,#ffc5e7 35%,#f3a0d2 75%,#df7db9 100%);box-shadow:inset 5px 0 0 #fff5,inset -5px -5px 0 #a84e83,0 5px 0 #b96c9e}
.machine-base:before{content:"";position:absolute;left:12%;top:12px;width:8px;height:49px;border-radius:99px;background:#fff8;transform:rotate(2deg)}
.crank{position:absolute;left:50%;top:17px;width:52px;height:15px;transform:translateX(-50%) rotate(-24deg);border:4px solid #71334f;border-radius:99px;background:linear-gradient(#fff2f8,#e887c0);box-shadow:inset 0 2px 0 #fff9}
.crank span{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border:4px solid #71334f;border-radius:50%;background:linear-gradient(135deg,#ffe7f4,#e78bc4);box-shadow:inset 2px 2px 0 #fff}
.dispenser{position:absolute;left:50%;bottom:7px;width:48px;height:39px;transform:translateX(-50%);border:5px solid #71334f;border-radius:25px 25px 12px 12px;background:linear-gradient(180deg,#873b69,#54213f);box-shadow:inset 0 5px 0 #ffffff18,0 3px 0 #fff5}
.dispenser span{position:absolute;left:7px;top:5px;width:24px;height:4px;border-radius:50%;background:#f6b7dd55}
.machine.is-rolling{animation:machine-wiggle .24s ease-in-out 3}
.machine.is-rolling .capsules{animation:capsule-rattle .22s ease-in-out 4 alternate}
.machine.is-rolling .crank{animation:crank-turn .8s ease-in-out}
@keyframes machine-wiggle{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
@keyframes capsule-rattle{from{transform:translateY(-2px) rotate(-5deg)}to{transform:translateY(3px) rotate(5deg)}}
@keyframes crank-turn{0%{transform:translateX(-50%) rotate(-24deg)}50%{transform:translateX(-50%) rotate(156deg)}100%{transform:translateX(-50%) rotate(336deg)}}

/* Compact dispenser proportions and a physically settled capsule pile. */
.machine{height:224px;max-width:188px}
.machine-top{height:23px;width:46%}
.globe{width:min(100%,120px)}
.capsules{
 inset:24% 9% 8%;
 display:grid;
 grid-template-columns:repeat(4,23px);
 grid-template-rows:repeat(4,17px);
 justify-content:center;
 align-content:end;
 justify-items:center;
 align-items:end;
 gap:0;
}
.capsule{
 width:27px;height:25px;flex:none;
}
.capsule:nth-child(1){grid-column:1;grid-row:4;transform:rotate(-17deg)}
.capsule:nth-child(2){grid-column:2;grid-row:4;transform:rotate(8deg)}
.capsule:nth-child(3){grid-column:3;grid-row:4;transform:rotate(-8deg)}
.capsule:nth-child(4){grid-column:4;grid-row:4;transform:rotate(16deg)}
.capsule:nth-child(5){grid-column:1;grid-row:3;transform:rotate(12deg)}

/* Toy-like capsule reveal sequence, matched to the pastel dispenser artwork. */
.machine{transform-origin:50% 82%}
.machine.is-rolling{animation:machine-rattle .14s ease-in-out 0s 7}
.machine.is-rolling .capsules{animation:capsule-tumble .72s ease-in-out 0s 2}
.machine.is-rolling .crank{animation:crank-turn .65s ease-in-out 0s 2}
.result{position:relative;overflow:hidden;min-height:74px}
.result .reveal-stage{display:flex;align-items:center;justify-content:center;gap:13px;min-height:92px;flex-wrap:wrap}
.result .reveal-capsule{position:relative;width:54px;height:50px;border:4px solid #71334f;border-radius:50%;background:linear-gradient(180deg,#fffaf2 0 48%,#f4a2d1 49%);box-shadow:inset -5px -5px 0 #71334f12,0 4px 0 #c88cae;animation:capsule-drop .75s cubic-bezier(.2,.8,.25,1) both}
.result .reveal-capsule:before{content:"";position:absolute;left:6px;right:6px;top:46%;height:3px;background:#71334f88}
.result .reveal-capsule:after{content:"";position:absolute;left:9px;top:7px;width:11px;height:6px;border-radius:50%;background:#fff;transform:rotate(-25deg)}
.result .reveal-capsule.open{animation:capsule-pop .5s cubic-bezier(.2,1.5,.4,1) forwards}
.result .reveal-burst{position:absolute;width:115px;height:115px;border-radius:50%;background:radial-gradient(circle,#fff8cf 0 8%,#ffda83 9% 20%,#ffb6c9 21% 35%,transparent 68%);animation:reveal-burst .6s ease-out both}
.result .reveal-duck{width:94px;height:84px;animation:duck-arrive .55s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 3px 0 #71334f35)}

.result .reveal-copy strong{display:block;font-size:20px;color:#71334f}

@keyframes machine-rattle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg) translateY(-2px)}75%{transform:rotate(2deg) translateY(1px)}}
@keyframes capsule-tumble{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-7px) rotate(5deg)}70%{transform:translateY(2px) rotate(-4deg)}}
@keyframes crank-turn{to{transform:rotate(720deg)}}
@keyframes capsule-drop{0%{transform:translateY(-28px) scale(.75);opacity:0}65%{transform:translateY(5px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1)}}
@keyframes capsule-pop{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.3) rotate(14deg)}100%{transform:scale(.15) rotate(35deg);opacity:0}}
@keyframes reveal-burst{0%{transform:scale(.15);opacity:0}45%{opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes duck-arrive{0%{transform:translateY(25px) scale(.45) rotate(-10deg);opacity:0}70%{transform:translateY(-5px) scale(1.12) rotate(5deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0)}}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('pond'),ctx=canvas.getContext('2d');
const W=900,H=600;
const species=[
 {id:'sunny',name:'Sunny',rarity:'Common',color:'#ffd83f',belly:'#ffae26',beak:'#f36c37',eye:'#4b2225',size:1,weight:42,premiumWeight:24,coinsPerSecond:1,cheek:'#ff987c',desc:'A classic sunny-yellow rubber duck.'},
 {id:'mint',name:'Minty',rarity:'Uncommon',color:'#a9dfb9',belly:'#70bf9b',beak:'#f36c37',eye:'#4b2225',size:1,weight:25,premiumWeight:22,coinsPerSecond:2,cheek:'#ff987c',desc:'A pastel mint-green rubber duck with cool shades.'},
 {id:'berry',name:'Berry',rarity:'Rare',color:'#d9a9e8',belly:'#b783d0',beak:'#f36c37',eye:'#4b2225',size:1,weight:17,premiumWeight:17,coinsPerSecond:4,cheek:'#ff987c',desc:'A lavender rubber duck with a flower clip.'},
 {id:'peach',name:'Peaches',rarity:'Rare',color:'#ffb58d',belly:'#f58a69',beak:'#f36c37',eye:'#4b2225',size:1,weight:10,premiumWeight:14,coinsPerSecond:4,cheek:'#ff987c',desc:'A peach-colored rubber duck with a cute bow.'},
 {id:'lilac',name:'Lulu',rarity:'Epic',color:'#aeb8f2',belly:'#8496dc',beak:'#f36c37',eye:'#4b2225',size:1,weight:5,premiumWeight:9,coinsPerSecond:8,cheek:'#ff987c',desc:'A periwinkle rubber duck with a little star badge.'},
 {id:'gold',name:'Goldie',rarity:'Legendary',color:'#fff0a1',belly:'#f6c94d',beak:'#f36c37',eye:'#4b2225',size:1,weight:1,premiumWeight:8,coinsPerSecond:15,cheek:'#ff987c',desc:'A shiny golden rubber duck wearing a tiny crown.'},
 {id:'zombie',name:'Zomduck',rarity:'Mythic',color:'#a8b99a',belly:'#748b78',beak:'#f36c37',eye:'#4b2225',size:1,weight:0,premiumWeight:4,coinsPerSecond:12,cheek:'#ff987c',desc:'A moss-green rubber duck with a playful patch accessory.'},
 {id:'vampire',name:'Count Quackula',rarity:'Mythic',color:'#62506f',belly:'#b8a4c5',beak:'#f36c37',eye:'#4b2225',size:1,weight:0,premiumWeight:2,coinsPerSecond:20,cheek:'#ff987c',desc:'A midnight-purple rubber duck with a tiny cape collar and bow.'}
];
const byId=id=>species.find(s=>s.id===id)||species[0];
const fresh=()=>({coins:100,ducks:[{id:'sunny',uid:1}],duckPoints:{},duplicateConversionV1:true,next:2,upgrade:0,rolls:0,gameInventory:{},gameEquipped:{},gameDuckStats:{},gameWins:0,gamePlays:0});
let state;
const save=()=>{try{localStorage.setItem('duckPondIdle2Save',JSON.stringify(state))}catch{}};
try{state=JSON.parse(localStorage.getItem('duckPondIdle2Save'))||fresh()}catch{state=fresh()}
if(!state||!Array.isArray(state.ducks)||!state.ducks.length)state=fresh();
state.coins=Math.max(0,Number(state.coins)||0);state.upgrade=Number(state.upgrade)||0;state.next=Number(state.next)||2;
state.duckPoints=state.duckPoints&&typeof state.duckPoints==='object'?state.duckPoints:{};
species.forEach(sp=>state.duckPoints[sp.id]=Math.max(0,Math.floor(Number(state.duckPoints[sp.id])||0)));
 state.gameInventory=state.gameInventory&&typeof state.gameInventory==='object'?state.gameInventory:{};
 state.gameEquipped=state.gameEquipped&&typeof state.gameEquipped==='object'?state.gameEquipped:{};
 state.gameDuckStats=state.gameDuckStats&&typeof state.gameDuckStats==='object'?state.gameDuckStats:{};
 state.gameWins=Math.max(0,Number(state.gameWins)||0);state.gamePlays=Math.max(0,Number(state.gamePlays)||0);
if(!state.duplicateConversionV1){
 const firstBySpecies=new Map(),converted={};
 state.ducks.forEach((duck,index)=>{
  if(!byId(duck.id)||!species.some(sp=>sp.id===duck.id))return;
  if(!firstBySpecies.has(duck.id))firstBySpecies.set(duck.id,duck);
  else converted[duck.id]=(converted[duck.id]||0)+1;
 });
 Object.entries(converted).forEach(([id,count])=>state.duckPoints[id]=(state.duckPoints[id]||0)+count);
 state.ducks=[...firstBySpecies.values()];
 state.duplicateConversionV1=true;
 save();
}

let tab='upgrades',last=performance.now(),toastTimer=0,rollBusy=false,selectedDuckId=null,gameDuckUid=null,gameSessionUid=null,gameStage='duck-select',hopRound=0,hopScore=0,hopTarget=-1,hopActive=false,hopLocked=false,hopTimer=null,hopFinished=false,hopWon=false,hopRewardId=null,outfitSelectedItem=null,outfitSelectedDuckUid=null;
const ducks=[],pads=[];
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function createDuck(id,initial=false){const s=byId(id);const d={uid:state.next++,id,x:rand(220,700),y:rand(235,465),vx:0,vy:0,dir:Math.random()<.5?-1:1,scale:s.size,phase:rand(0,8),blink:rand(2,6),targetX:rand(180,720),targetY:rand(365,490),pause:rand(1,3),bob:0,coinTimer:rand(.15,1),coinPop:0,coinAmount:0};ducks.push(d);if(!initial){state.ducks.push({id,uid:d.uid});save()}}
function addDuckPoints(id,amount=1){state.duckPoints[id]=(state.duckPoints[id]||0)+amount;save()}
state.ducks.forEach((d,i)=>{const s=byId(d.id);ducks.push({uid:d.uid||i+1,id:d.id,x:rand(210,700),y:rand(365,475),vx:0,vy:0,dir:Math.random()<.5?-1:1,scale:s.size,phase:rand(0,8),blink:rand(2,6),targetX:rand(180,720),targetY:rand(365,490),pause:rand(1,3),bob:0,coinTimer:rand(.15,1),coinPop:0,coinAmount:0})});
for(let i=0;i<8;i++)pads.push({x:rand(190,750),y:rand(210,490),r:rand(22,37),vx:0,vy:0,rot:rand(-.2,.2),phase:rand(0,7),flower:i%3===0});
function coinsPerSecond(){return state.ducks.reduce((total,duck)=>total+byId(duck.id).coinsPerSecond,0)*(1+state.upgrade*.5)}
function updateHUD(){$('coins').textContent=Math.floor(state.coins);$('duckCount').textContent=state.ducks.length;$('statRate').textContent=Number(coinsPerSecond().toFixed(1))}
function setTab(t){
  const order=['machine','outfits','upgrades','collection','games'],old=tab;
  if(t==='games'&&old!=='games'&&gameStage!=='playing'){gameStage='duck-select';gameDuckUid=null;}
  tab=t;
 if(t!=='upgrades')closePondUpgrades();
 document.querySelectorAll('.nav-item').forEach(b=>{const active=b.dataset.tab===t;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});
 document.querySelectorAll('.game-screen').forEach(el=>{
  const active=el.dataset.screen===t;
  el.classList.toggle('active',active);
  el.classList.toggle('leaving-left',!active&&order.indexOf(t)>order.indexOf(old));
 });
 renderPanel();
}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
const pondUpgradeOverlay=$('pondUpgradeOverlay'),openPondUpgrades=$('openPondUpgrades');
const closePondUpgrades=()=>{
 pondUpgradeOverlay.classList.remove('open');
 pondUpgradeOverlay.setAttribute('aria-hidden','true');
 openPondUpgrades.setAttribute('aria-expanded','false');
};
const showPondUpgrades=()=>{
 pondUpgradeOverlay.classList.add('open');
 pondUpgradeOverlay.setAttribute('aria-hidden','false');
 openPondUpgrades.setAttribute('aria-expanded','true');
 $('closePondUpgrades').focus();
};
openPondUpgrades.addEventListener('click',showPondUpgrades);
$('closePondUpgrades').addEventListener('click',closePondUpgrades);
$('closePondUpgradesBackdrop').addEventListener('click',closePondUpgrades);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pondUpgradeOverlay.classList.contains('open')){closePondUpgrades();openPondUpgrades.focus()}});
function renderPanel(){
 const p=tab==='machine'?$('machinePanel'):tab==='collection'?$('collectionPanel'):tab==='games'?$('gamesPanel'):tab==='outfits'?$('outfitsPanel'):$('pondPanel');
 if(tab==='machine'){
 p.innerHTML='<div class="panel-title"><h2>Lucky Duck Machine</h2><span>✧ Gacha ✧</span></div><p class="sub">Choose your capsule. Save up for the premium mix when you are ready to hunt for extraordinary friends.</p><div class="machine-wrap"><div class="machine" role="img" aria-label="Pastel pink duck capsule dispenser"><div class="machine-top"><span></span></div><div class="globe"><div class="capsules" id="capsules">'+Array.from({length:12},()=>'<i class="capsule"></i>').join('')+'</div><span class="glass-glint"></span></div><div class="machine-collar"></div><div class="machine-base"><div class="crank"><span></span></div><div class="dispenser"><span></span></div></div></div><div class="roll-info"><button class="roll-tier-btn classic" data-roll-tier="classic"><span>Classic Capsule</span><strong>25 Pond Coins</strong><small>33% Rare+ · original odds</small></button><button class="roll-tier-btn premium" data-roll-tier="premium"><span>Premium Capsule</span><strong>250 Pond Coins</strong><small>54% Rare+ · 6% Mythic chance</small></button><small class="roll-note">New friends join your pond automatically. Duplicates become species points.</small></div></div><div class="result" id="result">Your next little friend is waiting…</div>';
 p.querySelectorAll('[data-roll-tier]').forEach(button=>{button.disabled=state.coins<(button.dataset.rollTier==='premium'?250:25);button.addEventListener('click',()=>roll(button.dataset.rollTier))});
 }else if(tab==='games'){renderDuckGames(p);
  }else if(tab==='outfits'){renderOutfits(p);
  }else if(tab==='collection'){
 const counts={};state.ducks.forEach(d=>counts[d.id]=(counts[d.id]||0)+1);
 if(selectedDuckId&&counts[selectedDuckId]){
  const sp=byId(selectedDuckId),points=state.duckPoints[selectedDuckId]||0;
  p.innerHTML='<div class="panel-title"><h2>Duck Points</h2><button class="back-ducks" id="backToDucks">← My Ducks</button></div><div class="duck-detail-top"><canvas class="duck-detail-head" width="124" height="112" data-duck-head="'+sp.id+'" aria-label="'+sp.name+' head"></canvas><div><div class="duck-detail-name">'+sp.name+'</div><div class="duck-detail-meta">'+sp.rarity+' duck · '+sp.coinsPerSecond+' coins/sec</div></div></div><div class="duck-points-wallet"><canvas class="duck-point-head" width="72" height="60" data-duck-head="'+sp.id+'" aria-label="'+sp.name+' point icon"></canvas><div><b>'+points+'</b><small>'+sp.name+' Points</small></div></div><section class="duck-section"><div class="duck-section-head"><h3>✦ '+sp.name+' Upgrades</h3></div><p>Spend '+sp.name+' Points to improve this duck. Upgrades will be added here.</p><div class="duck-section-empty">Your '+sp.name+' upgrade shelf is ready for new discoveries.</div></section><section class="duck-section"><div class="duck-section-head"><h3>♡ Appearances</h3></div><p>Collect special looks for '+sp.name+' using '+sp.name+' Points.</p><div class="duck-section-empty">New appearances will be available here as they are introduced.</div></section>';
  $('backToDucks').addEventListener('click',()=>{selectedDuckId=null;renderPanel()});
 }else{
  selectedDuckId=null;
  p.innerHTML='<div class="panel-title"><h2>Your Duckies</h2><span>♡ '+state.ducks.length+' collected</span></div><p class="sub">Tap a duck to view its points, upgrades, and appearances.</p><div class="duck-grid">'+species.filter(sp=>counts[sp.id]).map(sp=>'<button class="duck-card" type="button" data-open-duck="'+sp.id+'"><canvas class="duck-thumb" width="124" height="112" data-duck-icon="'+sp.id+'" aria-label="'+sp.name+' rubber duck" style="background:linear-gradient(145deg,'+sp.color+',#fff1d2)"></canvas><div><b>'+sp.name+'</b><small>'+sp.rarity+'</small><small class="duck-point-count"><canvas class="duck-point-head" width="72" height="60" data-duck-head="'+sp.id+'" aria-hidden="true"></canvas><span>'+(state.duckPoints[sp.id]||0)+' points</span></small></div></button>').join('')+(Object.keys(counts).length===0?'<div class="empty">Your pond is waiting for its first duck.</div>':'')+'</div>';
  p.querySelectorAll('[data-open-duck]').forEach(card=>card.addEventListener('click',()=>{selectedDuckId=card.dataset.openDuck;renderPanel()}));
 }
 }else{
 const cost=100+state.upgrade*90;
 p.innerHTML='<div class="panel-title"><h2>Pond Improvements</h2><span>✿ Make it cozy</span></div><p class="sub">Little improvements help your pond earn more coins while you spend time together.</p><div class="upgrade-card"><div class="upgrade-icon">🌼</div><div><b>Flowering Banks</b><small>Increase coin earnings by 50% per level · Level '+state.upgrade+'</small></div><button class="buy" id="upgradeBtn" '+(state.coins<cost?'disabled':'')+'>'+cost+' ¢</button></div><div class="upgrade-card"><div class="upgrade-icon">🫧</div><div><b>Happy Habitat</b><small>Your ducks bring a little pond magic just by being here.</small></div><span style="font-size:11px;color:#9a8069">Always on</span></div><p class="sub" style="margin-top:15px">Your ducks make <b>'+Math.round(coinsPerSecond())+' coins</b> every second. Common ducks earn 1 coin/sec, with rarer friends earning more. Keep collecting to grow your little sanctuary.</p>';
 $('upgradeBtn').addEventListener('click',()=>{if(state.coins<cost)return;state.coins-=cost;state.upgrade++;save();updateHUD();renderPanel();toast('Your pond is blooming! 🌼')});
 }
 renderDuckIcons();
}
function roll(tier='classic'){
 const cost=tier==='premium'?250:25;
 if(rollBusy||state.coins<cost)return;
 rollBusy=true;state.coins-=cost;state.rolls++;save();updateHUD();
 const rollButtons=[...document.querySelectorAll('[data-roll-tier]')];rollButtons.forEach(button=>button.disabled=true);
 const result=$('result');
 if(result)result.innerHTML='<div class="reveal-stage"><span class="reveal-capsule" aria-hidden="true"></span><span>'+(tier==='premium'?'A special capsule is getting ready…':'Rattle, rattle… a little surprise is on its way!')+'</span></div>';
 const machine=$('machinePanel').querySelector('.machine');if(machine)machine.classList.add('is-rolling');
 const weightKey=tier==='premium'?'premiumWeight':'weight';
 const total=species.reduce((sum,sp)=>sum+(sp[weightKey]||0),0);let n=Math.random()*total,pick=species[0];
 for(const sp of species){n-=sp[weightKey]||0;if(n<=0){pick=sp;break}}
 setTimeout(()=>{
  if(machine)machine.classList.remove('is-rolling');
  if(result)result.innerHTML='<div class="reveal-stage"><span class="reveal-capsule open" aria-hidden="true"></span><span class="reveal-burst" aria-hidden="true"></span></div>';
  setTimeout(()=>{
   const alreadyOwned=state.ducks.some(duck=>duck.id===pick.id);
   if(alreadyOwned)addDuckPoints(pick.id,1);else createDuck(pick.id);
   save();updateHUD();
   if(result)result.innerHTML='<div class="reveal-stage"><canvas class="reveal-duck" width="180" height="160" data-duck-icon="'+pick.id+'" aria-label="'+pick.name+' rubber duck"></canvas><div class="reveal-copy"><strong>'+(alreadyOwned?'A '+pick.name+' duplicate! ✨':'Meet '+pick.name+'! ✨')+'</strong><small>'+pick.rarity+' · '+pick.desc+'</small><small>'+(alreadyOwned?'Converted into 1 '+pick.name+' Point.':'A new friend has joined your pond.')+'</small><small>'+(tier==='premium'?'Premium capsule · 250 Pond Coins':'Classic capsule · 25 Pond Coins')+'</small></div></div>';
   renderDuckIcons();rollBusy=false;
   document.querySelectorAll('[data-roll-tier]').forEach(button=>button.disabled=state.coins<(button.dataset.rollTier==='premium'?250:25));
  },420);
 },1050);
}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=5;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function drawTree(x,y,s,shade){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);

function drawGrass(x,y,s,color,t=0){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';
 // A broad, slow breeze with independent blade phases creates a soft flowing wave.
 // Every tuft shares the wind direction, but never bends in perfect unison.
 const seed=Math.floor(x*3+y*7);
 const breeze=Math.sin(t*.82+seed*.013)*4.2+Math.sin(t*.48+seed*.027)*2.1;
 for(let i=0;i<5;i++){
  const blade=27+((seed+i*17)%24);
  const phase=seed*.019+i*1.37;
  const sway=Math.sin(t*.76+phase)*3.1+breeze;
  const midSway=Math.sin(t*.76+phase-.5)*1.8+breeze*.52;
  const tipX=(i-2)*21-5+sway;
  const midX=(i-2)*13+midSway;
  const lift=Math.sin(t*.76+phase+.7)*1.5;
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.quadraticCurveTo(midX,-22+lift,tipX,-blade);
  ctx.stroke();
 }
 ctx.restore()
}

 ctx.strokeStyle='#c1dc91';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-p.r*.72,-p.r*.24);ctx.stroke();
 if(p.flower){ellipse(p.r*.25,-p.r*.12,7,7,'#f6d77a');for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ellipse(p.r*.25+Math.cos(a)*8,-p.r*.12+Math.sin(a)*7,5,4,'#fff0df')}}

 const makeVariant=(hue,satScale)=>{

   const max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min;

   pixels[i]=Math.round((rr+m)*255);pixels[i+1]=Math.round((gg+m)*255);pixels[i+2]=Math.round((bb+m)*255);
  }

  return canvas;
 };

  ellipse(0,-16,2.8,2.8,'#efc95d');
  ctx.restore();
 });
 // lily pads below ducks
 pads.forEach(p=>drawPad(p,t));
 // Ducks and their individual floating coin-income indicators.
 ducks.forEach(d=>drawDuck(d,t));
 ducks.forEach(d=>drawCoinIndicator(d));
 // layered foreground bank grass: irregular rooted clumps, with open gaps
 // Every root sits on the lower bank beyond the pond's water silhouette.
 const foregroundGrass=[
  {x:18,y:578,s:.82,c:'#5e8c58'},{x:62,y:594,s:.58,c:'#83ad69'},
  {x:142,y:585,s:.72,c:'#6f9b60'},{x:205,y:598,s:.52,c:'#91b875'},
  {x:286,y:579,s:.68,c:'#5d8c59'},{x:342,y:596,s:.56,c:'#83a967'},
  {x:414,y:588,s:.78,c:'#6b965d'},{x:478,y:599,s:.5,c:'#91b875'},
  {x:548,y:580,s:.7,c:'#5e8d59'},{x:620,y:595,s:.57,c:'#83ad69'},
  {x:692,y:584,s:.76,c:'#6f9b60'},{x:755,y:598,s:.53,c:'#91b875'},
  {x:828,y:580,s:.8,c:'#5e8d59'},{x:882,y:594,s:.58,c:'#83ad69'}
 ];
 foregroundGrass.forEach((g,i)=>{
  // A few overlapping tufts make each patch feel grown-in, not stamped.
  drawGrass(g.x,g.y,g.s,g.c,t);
  if(i%2===0)drawGrass(g.x+13,g.y+4,g.s*.58,i%4===0?'#9abd72':'#527f52',t);
 });
 // glints
 for(let i=0;i<7;i++){let x=(i*139+t*4)%900,y=365+(i*37)%140;ctx.fillStyle='rgba(255,255,226,.7)';ctx.beginPath();ctx.arc(x,y,1.8+Math.sin(t+i)*.7,0,Math.PI*2);ctx.fill()}
}
function step(dt,t){
 // Passive income remains continuous; each duck runs its own one-second payout cue.
 state.coins+=dt*coinsPerSecond();
 // Ducks select destinations and gently steer.
 ducks.forEach(d=>{
 d.phase+=dt;d.blink-=dt;if(d.blink<0)d.blink=rand(2.5,6);
 d.coinTimer-=dt;
 d.coinPop=Math.max(0,d.coinPop-dt);
 if(d.coinTimer<=0){
  d.coinTimer+=1;
  d.coinAmount=byId(d.id).coinsPerSecond*(1+state.upgrade*.5);
  d.coinPop=.9;
 }
 d.pause-=dt;
 if(d.pause<=0){d.targetX=rand(150,760);d.targetY=rand(350,500);d.pause=rand(3,7)}
 let dx=d.targetX-d.x,dy=d.targetY-d.y,dist=Math.hypot(dx,dy);
 let speed=dist>10?34:0;
 let ax=dist>10?dx/dist*speed:0,ay=dist>10?dy/dist*speed:0;
 // Avoid other ducks
 ducks.forEach(o=>{if(o===d)return;let ox=d.x-o.x,oy=d.y-o.y,dd=Math.hypot(ox,oy);if(dd<67&&dd>0){ax+=ox/dd*28;ay+=oy/dd*28}});
 // Collision response with lily pads: soft nudge and avoid walking through them
 pads.forEach(p=>{let ox=d.x-p.x,oy=d.y-p.y,dd=Math.hypot(ox,oy),min=p.r*.72+22*d.scale;if(dd<min&&dd>0){let nx=ox/dd,ny=oy/dd;let push=(min-dd);p.vx-=nx*push*2.2;p.vy-=ny*push*2.2;ax+=nx*75;ay+=ny*75;d.x+=nx*push*.08;d.y+=ny*push*.08}});
 d.vx+=(ax-d.vx)*Math.min(1,dt*1.8);d.vy+=(ay-d.vy)*Math.min(1,dt*1.8);
 d.x=clamp(d.x+d.vx*dt,120,790);d.y=clamp(d.y+d.vy*dt,350,505);
 if(Math.abs(d.vx)>2)d.dir=d.vx>0?1:-1;
 });
 pads.forEach(p=>{p.vx*=Math.pow(.12,dt);p.vy*=Math.pow(.12,dt);p.x=clamp(p.x+p.vx*dt,115,790);p.y=clamp(p.y+p.vy*dt,350,515);p.rot=clamp(p.rot+p.vx*.0004,-.25,.25)});
}
let lastDraw=0;
function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;const t=now/1000;step(dt,t);drawScene(t,dt);if(now-lastDraw>900){updateHUD();if(tab==='upgrades'){}lastDraw=now}requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*W,y=(e.clientY-rect.top)/rect.height*H;let hit=ducks.find(d=>Math.hypot(d.x-x,d.y-y)<42*d.scale);if(hit){hit.pause=0;hit.vy-=22;toast(byId(hit.id).name+' says quack! ♡')}else{let pad=pads.find(p=>Math.hypot(p.x-x,p.y-y)<p.r);if(pad){pad.vx+=rand(-25,25);pad.vy-=15;toast('A little ripple in the pond ✨')}}});
setInterval(()=>{save()},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
updateHUD();setTab('upgrades');requestAnimationFrame(frame);
})();
</script>
