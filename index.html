<style>

:root{--ink:#57332f;--ink2:#80564b;--cream:#fff8e9;--paper:#f8efdc;--sage:#8da878;--sage2:#dce7c9;--coral:#ed876b;--gold:#f5c85b;--shadow:0 7px 0 #d9c9a9,0 12px 24px #684b2c18}
*{box-sizing:border-box}html{background:#e8e0cb}body{margin:0;color:var(--ink);font-size:16px;font-weight:500;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,#fff9eb 0,#f3ead6 65%,#e9dfc9 100%);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #6c9b74;outline-offset:3px}
.app{width:min(100%,1120px);margin:auto;padding:14px 16px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}.brandmark{width:46px;height:46px;border-radius:16px;background:#ffdf72;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 #bd8744;font-size:27px}.brand h1{font-family:"Upheaval","Funny Duck",Georgia,serif;font-size:clamp(20px,3.8vw,26px);line-height:1;margin:0;letter-spacing:.2px;text-transform:uppercase}.brand small{display:block;color:#967466;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin-top:4px;font-weight:800}
.wallet{display:flex;gap:8px}.wallet-pill{background:#fff9ec;border:2px solid #e2d2b6;border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:7px;font-weight:900;box-shadow:0 3px 0 #d9c9a9;white-space:nowrap}.coin{width:20px;height:20px;border-radius:50%;background:linear-gradient(#ffe98d,#e9a82e);border:2px solid #a96a28;display:grid;place-items:center;font-size:11px;color:#87501f}
.scene-card{background:#e9d9b9;border:4px solid #765043;border-radius:25px;padding:7px;box-shadow:0 7px 0 #bda17b,0 13px 28px #684b2c22;position:relative}
.scene-head{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 9px}.scene-head strong{font-family:"Upheaval","Duck",Georgia,serif;font-size:16px;letter-spacing:.15px}.scene-head span{font-size:13px;color:#765b46;font-weight:700}

.stat{background:#fff8e9;border:2px solid #e5d5b8;border-radius:16px;padding:10px 8px;text-align:center;box-shadow:0 3px 0 #d9c9a9}.stat b{display:block;font-family:"Ducky",Georgia,serif;font-size:20px}.stat span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#9b806b;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.tab{padding:12px 7px;border-radius:15px;background:#e7dec9;border:2px solid #cdbb9d;box-shadow:0 4px 0 #c8b694;.font-weight:900;font-size:15px;transition:transform .12s,background .12s}.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #c8b694}.tab.active{background:#dce8c9;border-color:#91a77a;box-shadow:0 4px 0 #a6b58b}
.panel{background:#fff8e9;border:2px solid #e4d3b4;border-radius:22px;padding:15px;box-shadow:var(--shadow);min-height:230px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.panel-title h2{font: 400 23px "Upheaval","Funny Duck",Georgia,serif;margin:0;letter-spacing:.15px}.sub{font-size:14px;font-weight:500;color:#705b49;margin:7px 0 15px;line-height:1.55}
.machine-wrap{display:grid;grid-template-columns:minmax(130px,.8fr) 1fr;gap:14px;align-items:center}.machine{height:190px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column}.globe{width:128px;height:128px;border:5px solid #805449;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ffffffb8 0 7%,transparent 8%),linear-gradient(145deg,#c4f0e4d9,#7fc8b7b8);box-shadow:inset 0 0 0 4px #ffffff70,0 5px 0 #b8a07d;position:relative;overflow:hidden}.capsules{position:absolute;inset:15px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px;transition:transform .4s}.capsule{width:29px;height:36px;border-radius:16px 16px 13px 13px;border:2px solid #714b40;background:linear-gradient(110deg,#fff8 0 18%,transparent 20%),linear-gradient(#ffdc77 0 50%,#f08c66 51%);box-shadow:inset -3px -3px #00000012}.capsule:nth-child(2n){background:linear-gradient(110deg,#fff8 0 18%,transparent 20%),linear-gradient(#a9d8c3 0 50%,#6b9f83 51%)}.capsule:nth-child(3n){background:linear-gradient(110deg,#fff8 0 18%,transparent 20%),linear-gradient(#c7b6e7 0 50%,#8e78b5 51%)}.machine-base{width:115px;height:42px;margin-top:-3px;border:4px solid #805449;border-radius:12px 12px 18px 18px;background:linear-gradient(#f4a36f,#dc7958);box-shadow:0 5px 0 #a85d49;display:grid;place-items:center;font-size:12px;font-weight:1000;color:#fff8e9;letter-spacing:1px}.machine-base:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#f8d778;border:3px solid #805449;right:calc(50% - 82px);top:116px}
.roll-info{display:flex;flex-direction:column;gap:9px}.price{font-size:15px;color:#937966;font-weight:800}.roll-btn,.action-btn{background:linear-gradient(#f5cb68,#e9a94a);border:2px solid #a96e39;border-radius:15px;padding:13px 12px;box-shadow:0 5px 0 #b47a42;font-weight:1000;font-size:15px}.roll-btn:active,.action-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b47a42}.roll-btn:disabled{opacity:.55;filter:grayscale(.3);cursor:not-allowed}.result{margin-top:12px;background:#f7edda;border:2px dashed #d8c4a2;border-radius:16px;padding:11px;text-align:center;min-height:58px;font-weight:800;font-size:15px;line-height:1.45}.result strong{font-family:"Duck","JD Ducky",Georgia,serif;font-size:18px;display:block}
.duck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.duck-card{background:#f8f0df;border:2px solid #e3d1b0;border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;min-width:0}.duck-thumb{width:62px;height:62px;flex:none;border-radius:17px;background:#e5efdc;display:grid;place-items:center;font-size:37px}.duck-card b{display:block;font: 400 15px "Ducky","JD Ducky",Georgia,serif}.duck-card small{font-size:12px;color:#765e4b;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.empty{padding:22px;text-align:center;color:#997f69;font-size:13px;grid-column:1/-1}
.upgrade-card{display:flex;align-items:center;gap:12px;background:#f8f0df;border:2px solid #e3d1b0;border-radius:16px;padding:12px;margin-top:10px}.upgrade-icon{width:48px;height:48px;border-radius:15px;background:#dce9cf;display:grid;place-items:center;font-size:25px}.upgrade-card div:nth-child(2){flex:1}.upgrade-card b{font: 400 15px "Duck","JD Ducky",Georgia,serif}.upgrade-card small{display:block;color:#705b49;font-size:13px;font-weight:500;line-height:1.45;margin-top:4px}.buy{padding:9px 11px;border-radius:12px;background:#dce8c9;border:2px solid #91a77a;.font-weight:1000;font-size:14px;white-space:nowrap}.buy:disabled{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#57332f;color:#fff8e9;border-radius:99px;padding:12px 18px;font-size:15px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:9;box-shadow:0 5px 20px #0003;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{text-align:center;color:#8e765e;font-size:12px;margin:17px 0 4px}
@media(min-width:760px){.app{padding:22px 24px 34px}.game-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.85fr);gap:18px;align-items:start}.scene-column{position:sticky;top:16px}.stats{margin:13px 0 0}.right-column .tabs{margin-bottom:12px}.panel{min-height:330px}.machine-wrap{grid-template-columns:1fr 1fr}.machine{height:225px}.globe{width:150px;height:150px}.machine-base{width:135px}.machine-base:after{top:135px;right:calc(50% - 95px)}}
@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.wallet-pill{padding:7px 9px;font-size:13px}.brandmark{width:40px;height:40px}.brand h1{font-size:22px}.tabs{gap:6px}.tab{font-size:14px;padding:11px 4px}.panel{padding:12px}.machine-wrap{grid-template-columns:125px 1fr;gap:8px}.globe{width:116px;height:116px}.machine-base{width:105px}.machine-base:after{right:calc(50% - 75px);top:115px}.roll-btn{font-size:14px;padding:12px 6px}.duck-grid{grid-template-columns:1fr}}
@media(max-width:430px){.scene-head span{font-size:12px}.scene-foot{font-size:11px}.stat{padding:11px 5px}.stat span{font-size:11px;letter-spacing:.5px}.duck-card b,.upgrade-card b{font-size:16px}.roll-info small{font-size:12px!important;line-height:1.4}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">
<header class="topbar">
 <div class="brand"><div class="brandmark">🦆</div><div><h1>Duck Pond</h1><small>a little place to quack</small></div></div>
 <div class="wallet"><div class="wallet-pill"><span class="coin">¢</span><span id="coins">100</span></div><div class="wallet-pill">🦆 <span id="duckCount">1</span></div></div>
</header>
<div class="game-layout">
 <section class="scene-column">
  <div class="scene-card">
   <div class="scene-head"><strong>♡ Your little pond</strong><span id="pondMood">A lovely day outside</span></div>
   <canvas id="pond" width="900" height="600" aria-label="Animated pond with your rubber ducks"></canvas>
   <div class="scene-foot"><span>✿ Take a little look around</span><span id="duckHint">Tap a duck to say hello</span></div>
  </div>
  <div class="stats">
   <div class="stat"><b id="statDucks">1</b><span>Your flock</span></div>
   <div class="stat"><b id="statCoins">100</b><span>Pond coins</span></div>
   <div class="stat"><b id="statRate">0.2</b><span>Coins / min</span></div>
  </div>
 </section>
 <section class="right-column">
  <nav class="tabs" aria-label="Game menus">
   <button class="tab active" data-tab="machine">🎁 Roll</button>
   <button class="tab" data-tab="collection">🦆 My Ducks</button>
   <button class="tab" data-tab="upgrades">🌱 Pond</button>
  </nav>
  <main class="panel" id="panel"></main>
 </section>
</div>
<div class="footer">Made with a little sunshine & a lot of quacks ♡</div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('pond'),ctx=canvas.getContext('2d');
const W=900,H=600;
const species=[
 {id:'sunny',name:'Sunny',rarity:'Common',color:'#ffd83f',belly:'#ffae26',beak:'#f36c37',eye:'#4b2225',size:1,weight:42,cheek:'#ff987c',desc:'A cheerful little sunshine.'},
 {id:'mint',name:'Minty',rarity:'Uncommon',color:'#a9dfb9',belly:'#70bf9b',beak:'#ee9860',eye:'#3d4840',size:.88,weight:25,cheek:'#f39c9a',desc:'Calm, curious, and a little shy.'},
 {id:'berry',name:'Berry',rarity:'Rare',color:'#d9a9e8',belly:'#b783d0',beak:'#f18a83',eye:'#442d4c',size:1.04,weight:17,cheek:'#f6a6b2',desc:'A sweet duck with big daydreams.'},
 {id:'peach',name:'Peaches',rarity:'Rare',color:'#ffb58d',belly:'#f58a69',beak:'#d95d45',eye:'#58312b',size:1.1,weight:10,cheek:'#ff8e8b',desc:'Always looking for a snack.'},
 {id:'lilac',name:'Lulu',rarity:'Epic',color:'#aeb8f2',belly:'#8496dc',beak:'#f2a06c',eye:'#34345b',size:.95,weight:5,cheek:'#e7a1c5',desc:'A tiny pond daydreamer.'},
 {id:'gold',name:'Goldie',rarity:'Legendary',color:'#fff0a1',belly:'#f6c94d',beak:'#f27b37',eye:'#57351e',size:1.28,weight:1,cheek:'#ffad80',desc:'A rare little ray of light.'}
];
const byId=id=>species.find(s=>s.id===id)||species[0];
const fresh=()=>({coins:100,ducks:[{id:'sunny',uid:1}],next:2,upgrade:0,rolls:0});
let state;
try{state=JSON.parse(localStorage.getItem('duckPondIdle2Save'))||fresh()}catch{state=fresh()}
if(!state||!Array.isArray(state.ducks)||!state.ducks.length)state=fresh();
state.coins=Math.max(0,Number(state.coins)||0);state.upgrade=Number(state.upgrade)||0;state.next=Number(state.next)||2;
const save=()=>{try{localStorage.setItem('duckPondIdle2Save',JSON.stringify(state))}catch{}};
let tab='machine',last=performance.now(),toastTimer=0,rollBusy=false;
const ducks=[],pads=[];
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function createDuck(id,initial=false){const s=byId(id);const d={uid:state.next++,id,x:rand(220,700),y:rand(235,465),vx:0,vy:0,dir:Math.random()<.5?-1:1,scale:s.size,phase:rand(0,8),blink:rand(2,6),targetX:rand(180,720),targetY:rand(365,490),pause:rand(1,3),bob:0};ducks.push(d);if(!initial){state.ducks.push({id,uid:d.uid});save()}}
state.ducks.forEach((d,i)=>{const s=byId(d.id);ducks.push({uid:d.uid||i+1,id:d.id,x:rand(210,700),y:rand(365,475),vx:0,vy:0,dir:Math.random()<.5?-1:1,scale:s.size,phase:rand(0,8),blink:rand(2,6),targetX:rand(180,720),targetY:rand(365,490),pause:rand(1,3),bob:0})});
for(let i=0;i<8;i++)pads.push({x:rand(190,750),y:rand(210,490),r:rand(22,37),vx:0,vy:0,rot:rand(-.2,.2),phase:rand(0,7),flower:i%3===0});
function updateHUD(){$('coins').textContent=Math.floor(state.coins);$('duckCount').textContent=state.ducks.length;$('statDucks').textContent=state.ducks.length;$('statCoins').textContent=Math.floor(state.coins);$('statRate').textContent=(state.ducks.length*.2*(1+state.upgrade*.5)).toFixed(1)}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderPanel()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function renderPanel(){
 const p=$('panel');
 if(tab==='machine'){
 p.innerHTML='<div class="panel-title"><h2>Lucky Duck Machine</h2><span>✧ Gacha ✧</span></div><p class="sub">Give the little machine a turn and see who waddles out! Every capsule holds a surprise friend.</p><div class="machine-wrap"><div class="machine"><div class="globe"><div class="capsules" id="capsules">'+Array.from({length:9},()=>'<i class="capsule"></i>').join('')+'</div></div><div class="machine-base">DUCK TREATS</div></div><div class="roll-info"><div class="price">One mystery capsule<br><b>25 Pond Coins</b></div><button class="roll-btn" id="rollBtn">✦ Roll for a duck</button><small style="color:#9a8069;font-size:10px">New friends join your pond automatically.</small></div></div><div class="result" id="result">Your next little friend is waiting…</div>';
 $('rollBtn').disabled=state.coins<25;$('rollBtn').addEventListener('click',roll);
 }else if(tab==='collection'){
 const counts={};state.ducks.forEach(d=>counts[d.id]=(counts[d.id]||0)+1);
 p.innerHTML='<div class="panel-title"><h2>Your Duckies</h2><span>♡ '+state.ducks.length+' collected</span></div><p class="sub">Every duck has its own little personality. Duplicates become pond pals too!</p><div class="duck-grid">'+species.filter(s=>counts[s.id]).map(s=>'<div class="duck-card"><div class="duck-thumb" style="background:linear-gradient(145deg,'+s.color+',#fff1d2)">'+duckEmoji(s.id)+'</div><div><b>'+s.name+(counts[s.id]>1?' ×'+counts[s.id]:'')+'</b><small>'+s.rarity+'</small></div></div>').join('')+(Object.keys(counts).length===0?'<div class="empty">Your pond is waiting for its first duck.</div>':'')+'</div>';
 }else{
 const cost=100+state.upgrade*90;
 p.innerHTML='<div class="panel-title"><h2>Pond Improvements</h2><span>✿ Make it cozy</span></div><p class="sub">Little improvements help your pond earn more coins while you spend time together.</p><div class="upgrade-card"><div class="upgrade-icon">🌼</div><div><b>Flowering Banks</b><small>Increase coin earnings by 50% per level · Level '+state.upgrade+'</small></div><button class="buy" id="upgradeBtn" '+(state.coins<cost?'disabled':'')+'>'+cost+' ¢</button></div><div class="upgrade-card"><div class="upgrade-icon">🫧</div><div><b>Happy Habitat</b><small>Your ducks bring a little pond magic just by being here.</small></div><span style="font-size:11px;color:#9a8069">Always on</span></div><p class="sub" style="margin-top:15px">Your ducks make <b>'+(state.ducks.length*.2*(1+state.upgrade*.5)).toFixed(1)+' coins</b> every minute. Keep collecting to grow your little sanctuary.</p>';
 $('upgradeBtn').addEventListener('click',()=>{if(state.coins<cost)return;state.coins-=cost;state.upgrade++;save();updateHUD();renderPanel();toast('Your pond is blooming! 🌼')});
 }
}
function duckEmoji(id){return ({sunny:'🦆',mint:'🦆',berry:'🦆',peach:'🦆',lilac:'🦆',gold:'🦆'})[id]||'🦆'}
function roll(){
 if(rollBusy||state.coins<25)return;rollBusy=true;state.coins-=25;state.rolls++;save();updateHUD();$('rollBtn').disabled=true;$('result').textContent='Rattle, rattle… who could it be?';
 const c=$('capsules');if(c)c.style.transform='rotate(18deg) scale(1.13)';
 setTimeout(()=>{let total=species.reduce((a,s)=>a+s.weight,0),n=Math.random()*total,pick=species[0];for(const s of species){n-=s.weight;if(n<=0){pick=s;break}}
 createDuck(pick.id);save();updateHUD();const result=$('result');if(result)result.innerHTML='<strong>Meet '+pick.name+'! ✨</strong>'+pick.rarity+' · '+pick.desc+'<br><span style="font-size:11px;color:#987d67">A new friend has joined your pond.</span>';
 if(c)c.style.transform='';rollBusy=false;renderPanel();toast(pick.rarity==='Legendary'?'A legendary duck!! ✨':'A new duck joined the pond! 🦆');
 },950)
}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=5;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function drawTree(x,y,s,shade){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#89604a';ctx.beginPath();ctx.moveTo(-13,0);ctx.quadraticCurveTo(-7,-50,-10,-86);ctx.lineTo(14,-86);ctx.quadraticCurveTo(7,-35,17,0);ctx.fill();
 const colors=[shade,'#75a36d','#a8c47c'];[[0,-112,55],[ -34,-91,43],[35,-90,45],[-5,-67,42]].forEach((v,i)=>{ellipse(v[0],v[1],v[2],v[2]*.82,colors[i%3])});
 for(let i=0;i<9;i++){let a=i*2.4;ellipse(Math.cos(a)*31-4,-104+Math.sin(a)*25,8,6,'#c3d58d')}
 ctx.restore()
}
function drawGrass(x,y,s,color,t=0){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';
 // A broad, slow breeze with independent blade phases creates a soft flowing wave.
 // Every tuft shares the wind direction, but never bends in perfect unison.
 const seed=Math.floor(x*3+y*7);
 const breeze=Math.sin(t*.82+seed*.013)*4.2+Math.sin(t*.48+seed*.027)*2.1;
 for(let i=0;i<5;i++){
  const blade=27+((seed+i*17)%24);
  const phase=seed*.019+i*1.37;
  const sway=Math.sin(t*.76+phase)*3.1+breeze;
  const midSway=Math.sin(t*.76+phase-.5)*1.8+breeze*.52;
  const tipX=(i-2)*21-5+sway;
  const midX=(i-2)*13+midSway;
  const lift=Math.sin(t*.76+phase+.7)*1.5;
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.quadraticCurveTo(midX,-22+lift,tipX,-blade);
  ctx.stroke();
 }
 ctx.restore()
}
function drawPad(p,t){

function step(dt,t){

 });

}
